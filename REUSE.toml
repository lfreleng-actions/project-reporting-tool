version = 1
SPDX-PackageName = "lf-releng-project-reporting"
SPDX-PackageSupplier = "The Linux Foundation"
SPDX-PackageDownloadLocation = "https://github.com/lfreleng-actions/project-reporting-tool"

[[annotations]]
path = ["tests/regression/snapshots/**", "tests/regression/__snapshots__/**.ambr"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 The Linux Foundation"
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileComment = "Test snapshot data files - syrupy requires version marker as first line"

[[annotations]]
path = ["tests/fixtures/job_attribution/production_data.json", "src/config/schema.json", "src/themes/**/config.json", ".markdownlint.json", "testing/projects.json", "tests/fixtures/minimal_production_data.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 The Linux Foundation"
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileComment = "JSON configuration files (JSON format doesn't support comments)"

[[annotations]]
path = ["**/__pycache__/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileComment = "Python bytecode caches: git-ignored build artefacts that REUSE still scans when they sit inside a directory git does not yet track"
