---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

name: "📊 Production Reports"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug output'
        required: false
        type: boolean
        default: false
      skip_artifact_transfer:
        description: 'Skip JSON artifact transfer'
        required: false
        type: boolean
        default: true
      skip_pages_update:
        description: 'Skip GitHub Pages update'
        required: false
        type: boolean
        default: false
  schedule:
    # Run every day at 7:00 AM UTC
    - cron: "0 7 * * *"

concurrency:
  group: production-reports
  cancel-in-progress: false  # Don't cancel production runs

permissions: {}

jobs:
  validate-secrets:
    name: "Validate Secrets"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      run_timestamp: ${{ steps.metadata.outputs.timestamp }}
      run_id: ${{ steps.metadata.outputs.run_id }}
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: "audit"

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: "Generate run metadata"
        id: metadata
        shell: bash
        run: |
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "run_id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"

          {
            echo "## 📊 Production Report Generation"
            echo ""
            echo "**Started:** $timestamp"
            echo "**Run ID:** ${{ github.run_id }}"
            echo "**Trigger:** ${{ github.event_name }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Verify PROJECTS_JSON secret"
        shell: bash
        env:
          PROJECTS_JSON_B64: ${{ secrets.PROJECTS_JSON }}
        run: |
          # Check if secret is set and non-empty
          if [ -z "$PROJECTS_JSON_B64" ]; then
            echo "::error::PROJECTS_JSON secret is not set or not available"
            exit 1
          fi

          # Verify it's valid base64
          if ! echo "$PROJECTS_JSON_B64" | base64 -d > /dev/null 2>&1; then
            echo "::error::PROJECTS_JSON is not valid base64 encoded"
            exit 1
          fi

          echo "✅ PROJECTS_JSON secret exists (base64 encoded)"

      - name: "Validate required secrets"
        shell: bash
        env:
          CLASSIC_READ_ONLY_PAT_TOKEN: >-
            ${{ secrets.CLASSIC_READ_ONLY_PAT_TOKEN }}
          GERRIT_REPORTS_PAT_TOKEN: >-
            ${{ secrets.GERRIT_REPORTS_PAT_TOKEN }}
          LF_GERRIT_INFO_MASTER_SSH_KEY: >-
            ${{ secrets.LF_GERRIT_INFO_MASTER_SSH_KEY }}
        # yamllint disable rule:line-length
        run: |
          validation_failed=false

          # SHA1 of empty string - used to detect empty secrets
          EMPTY_SHA1="da39a3ee5e6b4b0d3255bfef95601890afd80709"

          echo "🔐 Secrets Validation"
          echo ""

          # Function to compute SHA1 without trailing newline
          compute_sha1() {
            printf "%s" "$1" | sha1sum | awk '{print $1}'
          }

          # Check CLASSIC_READ_ONLY_PAT_TOKEN
          if [ -z "$CLASSIC_READ_ONLY_PAT_TOKEN" ]; then
            echo "::error::CLASSIC_READ_ONLY_PAT_TOKEN secret is not set"
            echo "❌ CLASSIC_READ_ONLY_PAT_TOKEN: MISSING"
            validation_failed=true
          else
            token_sha1=$(compute_sha1 "$CLASSIC_READ_ONLY_PAT_TOKEN")
            if [ "$token_sha1" = "$EMPTY_SHA1" ]; then
              echo "::error::CLASSIC_READ_ONLY_PAT_TOKEN is empty"
              echo "❌ CLASSIC_READ_ONLY_PAT_TOKEN: EMPTY"
              validation_failed=true
            else
              echo "✅ CLASSIC_READ_ONLY_PAT_TOKEN: $token_sha1"
            fi
          fi

          # Check GERRIT_REPORTS_PAT_TOKEN
          if [ -z "$GERRIT_REPORTS_PAT_TOKEN" ]; then
            echo "::error::GERRIT_REPORTS_PAT_TOKEN secret is not set"
            echo "❌ GERRIT_REPORTS_PAT_TOKEN: MISSING"
            validation_failed=true
          else
            gerrit_token_sha1=$(compute_sha1 "$GERRIT_REPORTS_PAT_TOKEN")
            if [ "$gerrit_token_sha1" = "$EMPTY_SHA1" ]; then
              echo "::error::GERRIT_REPORTS_PAT_TOKEN is empty"
              echo "❌ GERRIT_REPORTS_PAT_TOKEN: EMPTY"
              validation_failed=true
            else
              echo "✅ GERRIT_REPORTS_PAT_TOKEN: $gerrit_token_sha1"
            fi
          fi

          # Check LF_GERRIT_INFO_MASTER_SSH_KEY (warning only)
          if [ -z "$LF_GERRIT_INFO_MASTER_SSH_KEY" ]; then
            echo "::warning::LF_GERRIT_INFO_MASTER_SSH_KEY secret not set"
            echo "⚠️  LF_GERRIT_INFO_MASTER_SSH_KEY: MISSING (HTTPS fallback)"
          else
            ssh_key_sha1=$(compute_sha1 "$LF_GERRIT_INFO_MASTER_SSH_KEY")
            if [ "$ssh_key_sha1" = "$EMPTY_SHA1" ]; then
              echo "::warning::LF_GERRIT_INFO_MASTER_SSH_KEY is empty"
              echo "⚠️  LF_GERRIT_INFO_MASTER_SSH_KEY: EMPTY (HTTPS fallback)"
            else
              echo "✅ LF_GERRIT_INFO_MASTER_SSH_KEY: $ssh_key_sha1"
            fi
          fi

          # Write summary
          {
            echo "### 🔐 Secrets Validation"
            echo ""
            if [ -n "$CLASSIC_READ_ONLY_PAT_TOKEN" ] && [ "${token_sha1:-$EMPTY_SHA1}" != "$EMPTY_SHA1" ]; then
              echo "- ✅ **CLASSIC_READ_ONLY_PAT_TOKEN:** \`${token_sha1}\`"
            else
              echo "- ❌ **CLASSIC_READ_ONLY_PAT_TOKEN:** MISSING or EMPTY"
            fi

            if [ -n "$GERRIT_REPORTS_PAT_TOKEN" ] && [ "${gerrit_token_sha1:-$EMPTY_SHA1}" != "$EMPTY_SHA1" ]; then
              echo "- ✅ **GERRIT_REPORTS_PAT_TOKEN:** \`${gerrit_token_sha1}\`"
            else
              echo "- ❌ **GERRIT_REPORTS_PAT_TOKEN:** MISSING or EMPTY"
            fi

            if [ -n "$LF_GERRIT_INFO_MASTER_SSH_KEY" ] && [ "${ssh_key_sha1:-$EMPTY_SHA1}" != "$EMPTY_SHA1" ]; then
              echo "- ✅ **LF_GERRIT_INFO_MASTER_SSH_KEY:** \`${ssh_key_sha1}\`"
            else
              echo "- ⚠️ **LF_GERRIT_INFO_MASTER_SSH_KEY:** MISSING or EMPTY (HTTPS fallback)"
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$validation_failed" = true ]; then
            echo "::error::Secret validation failed"
            exit 1
          fi

          echo ""
          echo "✅ All required secrets validated"
        # yamllint enable rule:line-length

      - name: "Validate PROJECTS_JSON schema"
        shell: bash
        env:
          PROJECTS_JSON_B64: ${{ secrets.PROJECTS_JSON }}
        # yamllint disable rule:line-length
        run: |
          # Decode base64-encoded PROJECTS_JSON secret
          projects_json=$(echo "$PROJECTS_JSON_B64" | base64 -d)

          # Validate JSON syntax
          if ! echo "$projects_json" | jq . > /dev/null 2>&1; then
            echo "::error::PROJECTS_JSON contains invalid JSON after base64 decode"
            exit 1
          fi

          # Validate structure
          if ! echo "$projects_json" | jq -e 'type == "array"' > /dev/null; then
            echo "::error::PROJECTS_JSON must be an array"
            exit 1
          fi

          # Validate required fields
          # Each project must have 'project' and 'slug',
          # plus either 'gerrit' or 'github'
          if ! echo "$projects_json" | \
            jq -e 'all(.project and .slug and (.gerrit or .github))' \
            > /dev/null; then
            echo "::error::Each project must have 'project' and" \
              "'slug' fields, plus at least one of 'gerrit' or 'github' fields"
            exit 1
          fi

          project_count=$(echo "$projects_json" | jq '. | length')
          echo "✅ PROJECTS_JSON schema valid - $project_count project(s) defined"
        # yamllint enable rule:line-length

  build-matrix:
    name: "Build Matrix"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.create-matrix.outputs.matrix }}
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: "audit"

      - name: "Create matrix from ACTIVE_PROJECTS"
        id: create-matrix
        shell: bash
        run: |
          # Build matrix from ACTIVE_PROJECTS variable
          # This job does NOT access any secrets
          active_projects="${VARS_ACTIVE_PROJECTS}"

          if [ -z "$active_projects" ]; then
            echo "::error::ACTIVE_PROJECTS variable is not set"
            exit 1
          fi

          matrix=$(echo "{\"slug\": $active_projects}" | jq -c .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          project_count=$(echo "$active_projects" | jq '. | length')

          {
            echo "### Projects to Process"
            echo ""
            echo "**Total projects:** $project_count"
            echo ""
            echo "$active_projects" | jq -r '.[] | "- \(.)"'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VARS_ACTIVE_PROJECTS: ${{ vars.ACTIVE_PROJECTS }}

  analyze:
    name: "${{ matrix.slug }}"
    needs: [validate-secrets, build-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: "audit"

      - name: "Extract project configuration"
        id: config
        shell: bash
        env:
          PROJECTS_JSON_B64: ${{ secrets.PROJECTS_JSON }}
          SLUG: ${{ matrix.slug }}
        run: |
          # Decode base64-encoded PROJECTS_JSON secret
          PROJECTS_JSON=$(echo "$PROJECTS_JSON_B64" | base64 -d)

          # Extract this project's configuration from PROJECTS_JSON
          # Validate that this slug exists
          if ! echo "$PROJECTS_JSON" | jq -e --arg slug "$SLUG" \
            '.[] | select(.slug == $slug)' > /dev/null; then
            echo "::error::Slug '$SLUG' not found in PROJECTS_JSON"
            echo "::error::Update ACTIVE_PROJECTS to match PROJECTS_JSON"
            exit 1
          fi

          project=$(echo "$PROJECTS_JSON" | jq -r \
            --arg slug "$SLUG" '.[] | select(.slug == $slug) | .project')
          gerrit=$(echo "$PROJECTS_JSON" | jq -r \
            --arg slug "$SLUG" '.[] | select(.slug == $slug) | .gerrit // ""')
          github=$(echo "$PROJECTS_JSON" | jq -r \
            --arg slug "$SLUG" '.[] | select(.slug == $slug) | .github // ""')
          jenkins=$(echo "$PROJECTS_JSON" | jq -r \
            --arg slug "$SLUG" '.[] | select(.slug == $slug) | .jenkins // ""')
          jenkins_user=$(echo "$PROJECTS_JSON" | jq -r \
            --arg slug "$SLUG" \
            '.[] | select(.slug == $slug) | .jenkins_user // ""')
          jenkins_token=$(echo "$PROJECTS_JSON" | jq -r \
            --arg slug "$SLUG" \
            '.[] | select(.slug == $slug) | .jenkins_token // ""')

          # Set outputs (non-secret values only)
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "gerrit=$gerrit" >> "$GITHUB_OUTPUT"
          echo "github=$github" >> "$GITHUB_OUTPUT"
          echo "jenkins=$jenkins" >> "$GITHUB_OUTPUT"

          # Set environment variables for secrets
          echo "JENKINS_USER=$jenkins_user" >> "$GITHUB_ENV"
          echo "JENKINS_API_TOKEN=$jenkins_token" >> "$GITHUB_ENV"

          echo "📋 Loaded configuration for: $project [$SLUG]"

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: "Clone Gerrit repositories"
        if: steps.config.outputs.gerrit != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-clone-action@dc04ead2bc1770ffdea30d20fdf05545180cfcdb  # v2.0.1
        id: clone-gerrit
        with:
          host: ${{ steps.config.outputs.gerrit }}
          output-path: "./${{ steps.config.outputs.gerrit }}"
          skip-archived: "true"
          threads: "4"
          clone-timeout: "600"
          retry-attempts: "5"
          retry-base-delay: "3.0"
          retry-max-delay: "60.0"
          use-https: "true"
          move-conflicting: "true"
          mirror: "false"

      - name: "Clone GitHub repositories"
        if: |
          steps.config.outputs.gerrit == '' &&
          steps.config.outputs.github != ''
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gerrit-clone-action@dc04ead2bc1770ffdea30d20fdf05545180cfcdb  # v2.0.1
        id: clone-github
        env:
          GITHUB_TOKEN: ${{ secrets.CLASSIC_READ_ONLY_PAT_TOKEN }}
        with:
          host: "github.com/${{ steps.config.outputs.github }}"
          output-path: "./github.com/${{ steps.config.outputs.github }}"
          skip-archived: "true"
          threads: "8"
          clone-timeout: "600"
          retry-attempts: "5"
          retry-base-delay: "3.0"
          retry-max-delay: "60.0"
          use-https: "true"
          mirror: "false"

      - name: "Check clone status"
        shell: bash
        # yamllint disable rule:line-length
        run: |
          # Determine which clone step ran and check its outcome
          if [ -n "${STEPS_CONFIG_OUTPUTS_GERRIT}" ]; then
            # Gerrit project
            if [ "${STEPS_CLONE_GERRIT_OUTCOME}" != "success" ]; then
              echo "::error::Failed to clone Gerrit repositories for ${STEPS_CONFIG_OUTPUTS_PROJECT}"
              echo "::error::Gerrit server may be unavailable or decommissioned"
              exit 1
            else
              echo "✅ Successfully cloned Gerrit repositories"
            fi
          elif [ -n "${STEPS_CONFIG_OUTPUTS_GITHUB}" ]; then
            # GitHub-only project
            if [ "${STEPS_CLONE_GITHUB_OUTCOME}" != "success" ]; then
              echo "::error::Failed to clone GitHub repositories for ${STEPS_CONFIG_OUTPUTS_PROJECT}"
              echo "::error::GitHub organization may be unavailable or inaccessible"
              exit 1
            else
              echo "✅ Successfully cloned GitHub repositories"
            fi
          else
            echo "::error::Project has neither gerrit nor github configured"
            exit 1
          fi
        env:
          STEPS_CONFIG_OUTPUTS_GERRIT: ${{ steps.config.outputs.gerrit }}
          STEPS_CLONE_GERRIT_OUTCOME: ${{ steps.clone-gerrit.outcome }}
          STEPS_CONFIG_OUTPUTS_PROJECT: ${{ steps.config.outputs.project }}
          STEPS_CONFIG_OUTPUTS_GITHUB: ${{ steps.config.outputs.github }}
          STEPS_CLONE_GITHUB_OUTCOME: ${{ steps.clone-github.outcome }}
        # yamllint enable rule:line-length

      - name: "Clone info-master repository"
        shell: bash
        run: |
          echo "🔗 Cloning info-master repository via HTTPS"

          https_url="https://gerrit.linuxfoundation.org/infra/releng/info-master"

          git clone "$https_url" ./info-master
          echo "✅ Cloned via HTTPS"

          echo "📂 Info-master contents:"
          find ./info-master -maxdepth 2 -type f -name "*.yaml" | head -5

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: "Set up Python"
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"

      - name: "Install dependencies"
        shell: bash
        run: uv sync --all-extras

      - name: "Generate reports for ${{ steps.config.outputs.project }}"
        shell: bash
        env:
          JENKINS_HOST: ${{ steps.config.outputs.jenkins }}
          # yamllint disable-line rule:line-length
          CLASSIC_READ_ONLY_PAT_TOKEN: ${{ secrets.CLASSIC_READ_ONLY_PAT_TOKEN }}
          GITHUB_ORG: ${{ steps.config.outputs.github }}
          SSH_AVAILABLE: ${{ env.SSH_AVAILABLE }}
          STEPS_CONFIG_OUTPUTS_PROJECT: ${{ steps.config.outputs.project }}
          STEPS_CONFIG_OUTPUTS_GERRIT: ${{ steps.config.outputs.gerrit }}
          STEPS_CONFIG_OUTPUTS_GITHUB: ${{ steps.config.outputs.github }}
        # yamllint disable rule:line-length
        run: |
          project="${STEPS_CONFIG_OUTPUTS_PROJECT}"
          echo "📊 Generating reports for $project"

          # Jenkins credentials already set in GITHUB_ENV by config step
          if [ -n "$JENKINS_USER" ] && [ -n "$JENKINS_API_TOKEN" ]; then
            echo "🔐 Using Jenkins authentication for $project"
            echo "✅ Jenkins credentials configured (user: ${JENKINS_USER})"
          fi

          if [ -n "$JENKINS_HOST" ]; then
            echo "🔧 Jenkins: $JENKINS_HOST"
            if [ -n "$JENKINS_USER" ]; then
              echo "🔧 Jenkins User: $JENKINS_USER"
            else
              echo "ℹ️ Jenkins authentication not configured"
            fi
          else
            echo "ℹ️ Jenkins integration disabled"
          fi

          if [ -n "$CLASSIC_READ_ONLY_PAT_TOKEN" ]; then
            echo "🔧 GitHub API integration enabled"
            echo "🔍 Using token environment variable: CLASSIC_READ_ONLY_PAT_TOKEN"
            # Debug token format (show prefix only for security)
            token_prefix="${CLASSIC_READ_ONLY_PAT_TOKEN:0:10}"
            token_length="${#CLASSIC_READ_ONLY_PAT_TOKEN}"
            echo "🔍 Token prefix: ${token_prefix}..."
            echo "🔍 Token length: ${token_length} characters"
            # Check for whitespace
            if [[ "$CLASSIC_READ_ONLY_PAT_TOKEN" =~ [[:space:]] ]]; then
              echo "⚠️  WARNING: Token contains whitespace characters!"
              # Try to trim whitespace
              trimmed_token=""
              trimmed_token=$(echo "$CLASSIC_READ_ONLY_PAT_TOKEN" | tr -d '[:space:]')
              export CLASSIC_READ_ONLY_PAT_TOKEN="$trimmed_token"
              echo "🔧 Token trimmed, new length: ${#CLASSIC_READ_ONLY_PAT_TOKEN}"
            fi

            # Verify token is accessible in environment for Python
            echo "🔍 Environment variable CLASSIC_READ_ONLY_PAT_TOKEN is set"

            # Test GitHub API access directly
            echo "🔍 Testing GitHub API access..."
            response=""
            response=$(curl -s -H "Authorization: Bearer ${CLASSIC_READ_ONLY_PAT_TOKEN}" \
              "https://api.github.com/user" | jq -r '.login // .message // "ERROR"')
            echo "🔍 GitHub API test response: ${response}"
          else
            echo "⚠️ GitHub API integration disabled - CLASSIC_READ_ONLY_PAT_TOKEN not set"
          fi

          if [ -n "$GITHUB_ORG" ]; then
            echo "🔍 GITHUB_ORG environment variable: ${GITHUB_ORG}"
          else
            echo "🔍 GITHUB_ORG environment variable: NOT SET (will auto-derive)"
          fi

          echo "📝 Running command with --github-token-env CLASSIC_READ_ONLY_PAT_TOKEN"
          echo "📝 Verifying environment variable is set:"
          if [ -n "$CLASSIC_READ_ONLY_PAT_TOKEN" ]; then
            echo "✅ CLASSIC_READ_ONLY_PAT_TOKEN is available to command"
          else
            echo "❌ CLASSIC_READ_ONLY_PAT_TOKEN is NOT available to command"
          fi

          # Determine repos path based on project type
          if [ -n "${STEPS_CONFIG_OUTPUTS_GERRIT}" ]; then
            repos_path="./${STEPS_CONFIG_OUTPUTS_GERRIT}"
          elif [ -n "${STEPS_CONFIG_OUTPUTS_GITHUB}" ]; then
            repos_path="./github.com/${STEPS_CONFIG_OUTPUTS_GITHUB}"
          else
            echo "::error::Cannot determine repos path - no gerrit or github configured"
            exit 1
          fi

          echo "📂 Using repos path: ${repos_path}"

          VERBOSE_FLAG=""
          if [ "${{ inputs.debug }}" = "true" ] || \
             [ "${RUNNER_DEBUG:-0}" = "1" ] || \
             [ "${ACTIONS_STEP_DEBUG:-false}" = "true" ]; then
            VERBOSE_FLAG="--verbose"
          fi

          uv run lf-releng-project-reporting generate \
            --project "$project" \
            --repos-path "${repos_path}" \
            --output-dir "./reports" \
            --github-token-env CLASSIC_READ_ONLY_PAT_TOKEN \
            $VERBOSE_FLAG

          echo "✅ Reports generated for $project"
        # yamllint enable rule:line-length

      - name: "Create report metadata"
        shell: bash
        run: |
          project="${STEPS_CONFIG_OUTPUTS_PROJECT}"
          report_dir="./reports/$project"

          if [ ! -d "$report_dir" ]; then
            echo "::error::Report directory not found: $report_dir"
            exit 1
          fi

          # Create metadata file
          cat > "$report_dir/metadata.json" <<EOF
          {
            "project": "$project",
            "slug": "${MATRIX_SLUG}",
            "gerrit_server": "${STEPS_CONFIG_OUTPUTS_GERRIT}",
            "jenkins_server": "${STEPS_CONFIG_OUTPUTS_JENKINS}",
            "github_org": "${STEPS_CONFIG_OUTPUTS_GITHUB}",
            "generated_at": \
              "${NEEDS_VALIDATE_SECRETS_OUTPUTS_RUN_TIMESTAMP}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_number": "${{ github.run_number }}",
            "workflow_run_attempt": "${{ github.run_attempt }}",
            "git_sha": "${{ github.sha }}",
            "git_ref": "${GITHUB_REF}",
            "environment": "production"
          }
          EOF

          echo "✅ Metadata created"
        env:
          STEPS_CONFIG_OUTPUTS_PROJECT: ${{ steps.config.outputs.project }}
          MATRIX_SLUG: ${{ matrix.slug }}
          STEPS_CONFIG_OUTPUTS_GERRIT: ${{ steps.config.outputs.gerrit }}
          STEPS_CONFIG_OUTPUTS_JENKINS: ${{ steps.config.outputs.jenkins }}
          STEPS_CONFIG_OUTPUTS_GITHUB: ${{ steps.config.outputs.github }}
          # yamllint disable-line rule:line-length
          NEEDS_VALIDATE_SECRETS_OUTPUTS_RUN_TIMESTAMP: ${{ needs.validate-secrets.outputs.run_timestamp }}

      - name: "Copy raw data files to temp directory"
        shell: bash
        run: |
          # Create temp directory for raw data files
          mkdir -p "./temp-raw-data-${MATRIX_SLUG}"

          # Copy JSON files to temp directory (flattening the structure)
          project="${STEPS_CONFIG_OUTPUTS_PROJECT}"
          if [ -f "./reports/$project/report_raw.json" ]; then
            cp "./reports/$project/report_raw.json" \
              "./temp-raw-data-${MATRIX_SLUG}/"
          fi
          if [ -f "./reports/$project/config_resolved.json" ]; then
            cp "./reports/$project/config_resolved.json" \
              "./temp-raw-data-${MATRIX_SLUG}/"
          fi
          if [ -f "./reports/$project/metadata.json" ]; then
            cp "./reports/$project/metadata.json" \
              "./temp-raw-data-${MATRIX_SLUG}/"
          fi

          echo "Raw data files prepared for upload"
        env:
          MATRIX_SLUG: ${{ matrix.slug }}
          STEPS_CONFIG_OUTPUTS_PROJECT: ${{ steps.config.outputs.project }}

      # Artifact uploads tolerate transient GitHub Actions service
      # failures (e.g. the CreateArtifact endpoint occasionally returns
      # an HTML error page instead of JSON). Each upload uses
      # `if: always()` so a failure in one upload step does not skip
      # subsequent upload steps for this matrix entry. We deliberately
      # do NOT set `continue-on-error: true` here: a true upload
      # failure should still mark the matrix entry as failed so the
      # summary job can surface the affected project in the Slack
      # notification. Resilience for the rest of the run is provided
      # by the broadened guards on the publish and
      # copy-to-artifacts-repo jobs (`needs.analyze.result != 'skipped'`).
      - name: "Upload raw data artifacts"
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: raw-data-${{ matrix.slug }}
          path: ./temp-raw-data-${{ matrix.slug }}/
          retention-days: 90
          if-no-files-found: warn
          compression-level: 9

      - name: "Upload report artifacts"
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: reports-${{ matrix.slug }}
          path: ./reports/${{ steps.config.outputs.project }}/
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6

      - name: "Upload clone manifest"
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clone-manifest-${{ matrix.slug }}
          # yamllint disable-line rule:line-length
          path: "./${{ steps.config.outputs.gerrit != '' && steps.config.outputs.gerrit || format('github.com/{0}', steps.config.outputs.github) }}/clone-manifest.json"
          retention-days: 90
          if-no-files-found: warn

      - name: "Determine log file path"
        id: log-path
        if: always()
        shell: bash
        run: |
          # Log file location based on gerrit-clone-action v0.1.14 behavior:
          # - Gerrit: ./gerrit.example.org/gerrit.example.org.log
          # - GitHub: ./github.com/orgname/github.com.orgname.log
          if [ -n "${STEPS_CONFIG_OUTPUTS_GERRIT}" ]; then
            # Gerrit: ./gerrit.example.org/gerrit.example.org.log
            gerrit_host="${STEPS_CONFIG_OUTPUTS_GERRIT}"
            log_path="./${gerrit_host}/${gerrit_host}.log"
          else
            # GitHub: ./github.com/orgname/github.com.orgname.log
            github_org="${STEPS_CONFIG_OUTPUTS_GITHUB}"
            sanitized_host="github.com.${github_org}"
            log_path="./github.com/${github_org}/${sanitized_host}.log"
          fi
          echo "path=$log_path" >> "$GITHUB_OUTPUT"
          echo "Log file path: $log_path"
        env:
          STEPS_CONFIG_OUTPUTS_GERRIT: ${{ steps.config.outputs.gerrit }}
          STEPS_CONFIG_OUTPUTS_GITHUB: ${{ steps.config.outputs.github }}

      - name: "Upload clone log"
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clone-log-${{ matrix.slug }}
          path: ${{ steps.log-path.outputs.path }}
          retention-days: 90
          if-no-files-found: warn

  publish:
    name: "Publish GitHub Pages"
    needs: [validate-secrets, build-matrix, analyze]
    # Run if validation succeeded and analyze was not entirely skipped.
    # We deliberately accept 'success', 'failure', and 'cancelled'
    # (e.g. when a matrix entry never started because a runner was
    # never assigned). Whatever artifacts were produced should still
    # be published rather than discarded on account of one transient
    # matrix problem.
    # yamllint disable-line rule:line-length
    if: always() && needs.validate-secrets.result == 'success' && needs.analyze.result != 'skipped' && (github.event_name != 'workflow_dispatch' || inputs.skip_pages_update == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    timeout-minutes: 20
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: "audit"

      - name: "Checkout main branch for scripts"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: "Copy script from main branch"
        shell: bash
        run: |
          mkdir -p /tmp/main-scripts
          cp .github/scripts/generate-index.sh /tmp/main-scripts/
          chmod +x /tmp/main-scripts/generate-index.sh
          echo "✅ Copied generate-index.sh from main branch"

      # This checkout intentionally persists credentials so the later
      # "git push origin gh-pages" step can authenticate. The token is
      # the repository-scoped GITHUB_TOKEN, so artipacked is suppressed.
      - name: "Checkout gh-pages branch"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3 # zizmor: ignore[artipacked]
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Download all report artifacts"
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: reports-*
          path: ./downloaded-reports
        continue-on-error: true

      - name: "Check for available reports"
        id: check-reports
        shell: bash
        run: |
          if [ -d "./downloaded-reports" ]; then
            report_count=$(find ./downloaded-reports -mindepth 1 \
              -maxdepth 1 -type d | wc -l)
            echo "count=$report_count" >> "$GITHUB_OUTPUT"
            echo "📦 Found $report_count report artifact(s)"
            if [ "$report_count" -eq 0 ]; then
              echo "::warning::No report artifacts found to publish"
            fi
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No downloaded-reports directory found"
          fi

      - name: "Prepare production reports at root"
        if: steps.check-reports.outputs.count != '0'
        shell: bash
        # yamllint disable rule:line-length
        run: |
          echo "📦 Preparing production reports at root level"

          # Process each downloaded report
          report_count=0
          for artifact_dir in ./downloaded-reports/reports-*
          do
            if [ ! -d "$artifact_dir" ]; then
              continue
            fi

            # Extract slug from artifact directory name (reports-{slug})
            slug=$(basename "$artifact_dir" | sed 's/^reports-//')

            echo "Processing artifact: reports-$slug"

            # Create project directory at root level
            target_dir="$slug"
            mkdir -p "$target_dir"

            # Find and copy report files (handle nested directory structure)
            # Artifacts may contain project directory, so search recursively
            report_html=$(find "$artifact_dir" -name "report.html" -type f | head -n 1)
            if [ -n "$report_html" ]; then
              cp "$report_html" "$target_dir/"
            fi

            report_json=$(find "$artifact_dir" -name "report_raw.json" -type f | head -n 1)
            if [ -n "$report_json" ]; then
              cp "$report_json" "$target_dir/"
            fi

            report_md=$(find "$artifact_dir" -name "report.md" -type f | head -n 1)
            if [ -n "$report_md" ]; then
              cp "$report_md" "$target_dir/"
            fi

            metadata=$(find "$artifact_dir" -name "metadata.json" -type f | head -n 1)
            if [ -n "$metadata" ]; then
              cp "$metadata" "$target_dir/"
            fi

            theme_css=$(find "$artifact_dir" -name "theme.css" -type f | head -n 1)
            if [ -n "$theme_css" ]; then
              cp "$theme_css" "$target_dir/"
            fi

            report_count=$((report_count + 1))
            echo "  ✅ Prepared $slug"
          done

          echo "REPORT_COUNT=$report_count" >> "$GITHUB_ENV"
          echo "✅ Prepared $report_count project report(s) at root"
        # yamllint enable rule:line-length

      - name: "Generate index page"
        if: steps.check-reports.outputs.count != '0'
        shell: bash
        run: |
          # Create .nojekyll to disable Jekyll processing
          touch .nojekyll
          echo "✅ Created .nojekyll file"

          # Generate index at root (pass "." as directory)
          bash /tmp/main-scripts/generate-index.sh . production

      - name: "Commit and push changes"
        if: steps.check-reports.outputs.count != '0'
        shell: bash
        run: |
          git config user.name "lf-releng-reports-bot"
          git config user.email "lf-releng+reports-bot@linuxfoundation.org"

          # Add all project directories and index
          git add index.html || true
          git add .nojekyll || true

          # Add all project report directories (exclude previews/)
          for project_dir in */; do
            # Skip previews and non-report directories
            if [ -d "$project_dir" ] && \
               [ "$project_dir" != "previews/" ] && \
               [ -f "$project_dir/report.html" ]; then
              echo "Adding $project_dir"
              git add "$project_dir"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          cat > /tmp/commit-msg.txt <<EOF
          chore: update production reports (run ${{ github.run_id }})

          Generated: ${NEEDS_VALIDATE_SECRETS_OUTPUTS_RUN_TIMESTAMP}
          Reports: ${REPORT_COUNT} project(s)
          Run: ${{ github.run_id }}
          EOF

          git commit -F /tmp/commit-msg.txt
          git push origin gh-pages

          echo "✅ Published to GitHub Pages"

          {
            echo "## 📤 Reports Published"
            echo ""
            echo "**Reports published:** ${REPORT_COUNT}"
            echo "**Branch:** gh-pages"
            echo "**Path:** (root)"
            echo ""
            echo "### 🌐 View Reports"
            echo ""
            echo "Reports will be available at:"
            owner="${{ github.repository_owner }}"
            repo="${GITHUB_EVENT_REPOSITORY_NAME}"
            echo "https://${owner}.github.io/${repo}/"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          # yamllint disable-line rule:line-length
          NEEDS_VALIDATE_SECRETS_OUTPUTS_RUN_TIMESTAMP: ${{ needs.validate-secrets.outputs.run_timestamp }}
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: "Report publish status"
        if: steps.check-reports.outputs.count == '0'
        shell: bash
        run: |
          {
            echo "## ⚠️ No Reports Published"
            echo ""
            echo "No report artifacts were available to publish."
            echo "This may occur if all matrix jobs failed."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Fail job if no reports were published"
        if: steps.check-reports.outputs.count == '0'
        shell: bash
        run: |
          echo "::error::No report artifacts were available to publish"
          exit 1

  copy-to-artifacts-repo:
    name: "Transfer/Copy Artifacts"
    needs: [validate-secrets, build-matrix, analyze]
    # Run if validation succeeded and analyze was not entirely skipped.
    # Mirrors the publish job: a single transient matrix failure or a
    # matrix entry that never started must not prevent us from
    # transferring artifacts we did successfully gather.
    # yamllint disable-line rule:line-length
    if: always() && needs.validate-secrets.result == 'success' && needs.analyze.result != 'skipped' && (github.event_name != 'workflow_dispatch' || inputs.skip_artifact_transfer == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: "audit"

      - name: "Checkout repository for scripts"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: "Download all artifacts"
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ./downloaded-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: "Check for available artifacts"
        id: check-artifacts
        shell: bash
        run: |
          if [ -d "./downloaded-artifacts" ]; then
            artifact_count=$(find ./downloaded-artifacts -mindepth 1 \
              -maxdepth 1 -type d | wc -l)
            echo "count=$artifact_count" >> "$GITHUB_OUTPUT"
            echo "📦 Found $artifact_count artifact(s)"
            if [ "$artifact_count" -eq 0 ]; then
              echo "::warning::No artifacts found to transfer"
            fi
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "::warning::No downloaded-artifacts directory found"
          fi

      - name: "Generate date folder name"
        id: date
        shell: bash
        env:
          # Single source of truth for the run's date. The timestamp
          # captured by validate-secrets at the start of the original
          # workflow run is preserved across `Re-run failed jobs`,
          # whereas `date -u` on the runner would yield the wall-clock
          # date of the re-run. Anchoring the artifact folder to the
          # original run date keeps re-runs idempotent: they refresh
          # the original day's folder in project-reporting-artifacts
          # rather than overwriting a later day's contents.
          RUN_TIMESTAMP: ${{ needs.validate-secrets.outputs.run_timestamp }}
        run: |
          # run_timestamp is YYYY-MM-DDTHH:MM:SSZ; strip the time part.
          DATE_FOLDER="${RUN_TIMESTAMP%%T*}"
          if [ -z "$DATE_FOLDER" ] || \
             ! printf '%s' "$DATE_FOLDER" | \
             grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::warning::run_timestamp missing or malformed" \
              "('$RUN_TIMESTAMP'); falling back to current UTC date"
            DATE_FOLDER=$(date -u +%Y-%m-%d)
          fi
          echo "folder=${DATE_FOLDER}" >> "$GITHUB_OUTPUT"
          echo "Date folder: ${DATE_FOLDER}"

      - name: "Debug: Show downloaded artifacts"
        if: steps.check-artifacts.outputs.count != '0'
        shell: bash
        run: |
          echo "=== Downloaded artifacts structure ==="
          if [ -d "./downloaded-artifacts" ]; then
            find ./downloaded-artifacts -maxdepth 2 -type d | sort
            echo ""
            echo "=== Total artifact count ==="
            find ./downloaded-artifacts -mindepth 1 -maxdepth 1 -type d | wc -l
            echo ""
            echo "=== Total file count ==="
            find ./downloaded-artifacts -type f | wc -l
          else
            echo "ERROR: ./downloaded-artifacts directory does not exist!"
            exit 1
          fi

      - name: "Copy artifacts to project-reporting-artifacts repository"
        if: steps.check-artifacts.outputs.count != '0'
        shell: bash
        env:
          GERRIT_REPORTS_PAT_TOKEN: ${{ secrets.GERRIT_REPORTS_PAT_TOKEN }}
          STEPS_DATE_OUTPUTS_FOLDER: ${{ steps.date.outputs.folder }}
        run: |
          chmod +x .github/scripts/copy-artifacts-simple.sh
          .github/scripts/copy-artifacts-simple.sh \
            "${STEPS_DATE_OUTPUTS_FOLDER}" \
            "${{ github.run_id }}" \
            "./downloaded-artifacts" \
            "$GERRIT_REPORTS_PAT_TOKEN"

      - name: "Generate job summary"
        if: always()
        shell: bash
        # yamllint disable rule:line-length
        run: |
          artifact_count="${STEPS_CHECK_ARTIFACTS_OUTPUTS_COUNT}"

          # Determine actual status based on artifact count
          if [ "$artifact_count" -eq 0 ] 2>/dev/null || [ -z "$artifact_count" ]; then
            status="failure"
            status_emoji="❌"
          else
            status="success"
            status_emoji="✅"
          fi

          {
            echo "## 📦 Artifacts Transferred"
            echo ""
            echo "**Date Folder:** ${STEPS_DATE_OUTPUTS_FOLDER}"
            echo "**Workflow Run:** ${{ github.run_id }}"
            echo "**Target Repository:** lfreleng-actions/project-reporting-artifacts"
            echo "**Status:** ${status_emoji} ${status}"
            echo "**Artifacts Found:** ${artifact_count:-0}"
            echo ""

            # Only show repository link if artifacts were actually transferred
            if [ "$artifact_count" -gt 0 ] 2>/dev/null; then
              echo "### 🔗 View in Repository"
              echo ""
              echo "https://github.com/lfreleng-actions/project-reporting-artifacts/tree/main/data/artifacts/${STEPS_DATE_OUTPUTS_FOLDER}"
              echo ""
            else
              echo "### ⚠️ No Artifacts Transferred"
              echo ""
              echo "No artifacts were available to transfer to the target repository."
              echo "This occurs when all matrix analysis jobs fail."
              echo ""
              echo "**Troubleshooting:**"
              echo "- Check the **Analyze** job logs for errors"
              echo "- Verify the PROJECTS_JSON secret is properly base64-encoded"
              echo "- Ensure Gerrit/GitHub servers are accessible"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          STEPS_CHECK_ARTIFACTS_OUTPUTS_COUNT: ${{ steps.check-artifacts.outputs.count }}
          STEPS_DATE_OUTPUTS_FOLDER: ${{ steps.date.outputs.folder }}
        # yamllint enable rule:line-length

      - name: "Fail job if no artifacts were transferred"
        if: steps.check-artifacts.outputs.count == '0'
        shell: bash
        run: |
          echo "::error::No artifacts were available to transfer"
          exit 1

  summary:
    name: "Workflow Summary"
    needs:
      - validate-secrets
      - build-matrix
      - analyze
      - publish
      - copy-to-artifacts-repo
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    steps:
      # Harden the runner
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: "audit"

      - name: "Generate workflow summary"
        if: always()
        id: "workflow-status"
        shell: bash
        env:
          PROJECTS_JSON_B64: ${{ secrets.PROJECTS_JSON }}
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          # Helper function to convert result to emoji
          result_emoji() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⚠️" ;;
              skipped) echo "⏭️" ;;
              *) echo "❓" ;;
            esac
          }

          # Determine overall workflow status
          validate_result="${{ needs.validate-secrets.result }}"
          analyze_result="${{ needs.analyze.result }}"
          publish_result="${{ needs.publish.result }}"
          copy_result="${{ needs.copy-to-artifacts-repo.result }}"
          matrix_result="${{ needs.build-matrix.result }}"

          # Check if any job had a non-success outcome
          # (catches failure, cancelled, timed_out, etc.)
          is_bad() {
            [ "$1" != "success" ] && [ "$1" != "skipped" ]
          }
          workflow_failed="false"
          if is_bad "$validate_result" || \
             is_bad "$analyze_result" || \
             is_bad "$publish_result" || \
             is_bad "$copy_result" || \
             is_bad "$matrix_result"; then
            workflow_failed="true"
          fi

          echo "workflow_failed=${workflow_failed}" >> "$GITHUB_OUTPUT"
          echo "validate_result=${validate_result}" >> "$GITHUB_OUTPUT"
          echo "analyze_result=${analyze_result}" >> "$GITHUB_OUTPUT"
          echo "publish_result=${publish_result}" >> "$GITHUB_OUTPUT"
          echo "copy_result=${copy_result}" >> "$GITHUB_OUTPUT"
          echo "matrix_result=${matrix_result}" >> "$GITHUB_OUTPUT"

          # Build a list of failed stages for the Slack message
          # (reports any non-success, non-skipped result)
          failed_stages=""
          if is_bad "$validate_result"; then
            failed_stages="${failed_stages}• Secrets Validation\n"
          fi
          if is_bad "$matrix_result"; then
            failed_stages="${failed_stages}• Matrix Build\n"
          fi
          if is_bad "$analyze_result"; then
            failed_stages="${failed_stages}• Project Analysis\n"
          fi
          if is_bad "$publish_result"; then
            failed_stages="${failed_stages}• Pages Publishing\n"
          fi
          if is_bad "$copy_result"; then
            failed_stages="${failed_stages}• Artifact Transfer\n"
          fi

          # Output as single line (\n stays literal for Slack mrkdwn)
          echo "failed_stages=${failed_stages}" >> "$GITHUB_OUTPUT"


          # Parse projects JSON to get slugs (decode from base64)
          # Only decode if validation succeeded (avoids fatal error)
          projects_json=""
          if [ "$validate_result" = "success" ]; then
            projects_json=$(echo "$PROJECTS_JSON_B64" | base64 -d)
          fi

          {
            echo "## 📊 Production Report Generation Complete"
            echo ""
            echo "**Completed:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**Status:** ${{ needs.publish.result }}"
            echo ""
            echo "### Job Results"
            echo ""
            echo "- **Validate Secrets:** $(result_emoji \
              '${{ needs.validate-secrets.result }}')"
            echo "- **Analyze:** $(result_emoji \
              '${{ needs.analyze.result }}')"
            echo "- **Publish:** $(result_emoji \
              '${{ needs.publish.result }}')"
            echo "- **Copy:** $(result_emoji \
              '${{ needs.copy-to-artifacts-repo.result }}')"
            echo ""

            # Note about failures - partial vs complete failure
            if [ "${{ needs.analyze.result }}" = "failure" ]; then
              # Check if publish also failed (indicates complete failure)
              if [ "${{ needs.publish.result }}" = "failure" ] && \
                 [ "${{ needs.copy-to-artifacts-repo.result }}" = "failure" ]
              then
                echo "### ❌ Complete Matrix Failure"
                echo ""
                echo "All project analysis jobs failed." \
                  "No reports were generated."
                echo ""
                echo "**Troubleshooting:**"
                echo "- Check the **Analyze** job logs for specific errors"
                echo "- Verify the PROJECTS_JSON secret is properly" \
                  "base64-encoded"
                echo "- Ensure Gerrit/GitHub servers are accessible"
                echo "- Check for network connectivity issues"
                echo ""
              else
                echo "### ⚠️ Partial Matrix Failure"
                echo ""
                echo "Some project analysis jobs failed, but reports from"
                echo "successful jobs were still published."
                echo ""
              fi
            fi

            # Add links to project reports if publish succeeded
            if [ "${{ needs.publish.result }}" = "success" ]; then
              echo "### 📑 Project Reports"
              echo ""
              owner="${{ github.repository_owner }}"
              repo="${GITHUB_EVENT_REPOSITORY_NAME}"
              base_url="https://${owner}.github.io/${repo}"

              # Parse and display each project with link
              echo "$projects_json" | \
                jq -r '.[] | "\(.project)|\(.slug)"' | \
                while IFS='|' read -r project_name slug; do
                report_url="${base_url}/${slug}/report.html"
                data_url="${base_url}/${slug}/report_raw.json"
                echo "- **${project_name}:** [View Report](${report_url})" \
                  "• [Raw Data](${data_url})"
              done
              echo ""
              echo "**Index:** [View All Reports](${base_url}/)"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"


      - name: "Identify failed projects"
        id: "failed-projects"
        # yamllint disable-line rule:line-length
        if: needs.analyze.result != 'success' && needs.analyze.result != 'skipped'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        # yamllint disable rule:line-length
        run: |
          # Query the GitHub API for matrix job results
          echo "Checking matrix job results..."

          FAILED_PROJECTS=$(gh api \
            "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --paginate \
            --jq '.jobs[] | select(.conclusion != "success" and .conclusion != null and .conclusion != "skipped" and (.name | test("^[a-z][a-z0-9-]*$"))) | .name' \
            | sort)

          if [ -n "$FAILED_PROJECTS" ]; then
            echo "Failed projects:"
            while IFS= read -r P; do
              [ -z "$P" ] && continue
              echo "  - ${P}"
            done <<< "$FAILED_PROJECTS"
          else
            echo "Could not determine specific failed projects"
            FAILED_PROJECTS="(check workflow run for details)"
          fi

          # Join project names into single line for YAML safety
          ESCAPED_PROJECTS=$(echo "$FAILED_PROJECTS" | paste -sd ',' - | sed 's/,/, /g')
          echo "list=${ESCAPED_PROJECTS}" >> "$GITHUB_OUTPUT"
        # yamllint enable rule:line-length

      - name: "Check Slack configuration"
        id: "check-slack-config"
        if: always()
        shell: bash
        env:
          SLACK_BOT_TOKEN: "${{ secrets.SLACK_BOT_TOKEN }}"
        run: |
          if [ -n "$SLACK_BOT_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Send Slack failure notification"
        if: >-
          always()
          && steps.workflow-status.outputs.workflow_failed == 'true'
          && steps.check-slack-config.outputs.configured == 'true'
          && vars.SLACK_CHANNEL_ID != ''
        # yamllint disable-line rule:line-length
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c  # v3.0.3
        with:
          method: 'chat.postMessage'
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          # yamllint disable rule:line-length
          payload: |
            channel: "${{ vars.SLACK_CHANNEL_ID }}"
            text: "❌ Production Reports workflow failed"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "❌ Production Reports — Failure"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Failed stages:*\n${{ steps.workflow-status.outputs.failed_stages }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Failed projects:*\n```${{ steps.failed-projects.outputs.list || 'N/A (no matrix project failures detected)' }}```"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Validate:* ${{ steps.workflow-status.outputs.validate_result }}"
                  - type: "mrkdwn"
                    text: "*Analyze:* ${{ steps.workflow-status.outputs.analyze_result }}"
                  - type: "mrkdwn"
                    text: "*Publish:* ${{ steps.workflow-status.outputs.publish_result }}"
                  - type: "mrkdwn"
                    text: "*Artifact Transfer:* ${{ steps.workflow-status.outputs.copy_result }}"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
          # yamllint enable rule:line-length
